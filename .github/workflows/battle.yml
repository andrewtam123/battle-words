name: Publish battle service
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: battle-service
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: battle-production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run battle:check
      - name: Publish Worker and Durable Object
        run: npm run battle:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
